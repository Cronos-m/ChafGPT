                <button class="invisible-key h-14 w-14" data-key="9">9</button>

    <script>
        const path = window.location.pathname.replace('/', '');
        const currentMago = path && path !== 'index.html' && path !== 'c.html' ? path.toLowerCase() : 'anonimo';
        
        let forcePosition = '';
        let isForceModeActive = false;
        let magoConfigs = [];
        let sendBtnClickCount = 0;
        let sendBtnClickTimer = null;

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }

        const userInput = document.getElementById('user-input');
        const chatContainer = document.getElementById('chat-container');
        const messagesArea = document.getElementById('messages-area');
        const welcomeScreen = document.getElementById('welcome-screen');

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        window.addEventListener('load', () => {
            const { db, ref, onValue } = window.firebaseDb;
            
            const dbRef = ref(db, `magos/${currentMago}/listas`);
            onValue(dbRef, (snapshot) => {
                const data = snapshot.val();
                magoConfigs = data ? Object.values(data) : [];
            });

            const posRef = ref(db, `magos/${currentMago}/posicion`);
            onValue(posRef, (snapshot) => {
                forcePosition = snapshot.val() || '';
                if (forcePosition) {
                    isForceModeActive = true;
                    document.getElementById('force-indicator-line').classList.add('active');
                    document.getElementById('footer-text').innerHTML = `ChatGPT es IA. Al usarlo, aceptas los <a href="#" class="underline hover:text-white">Términos</a> y la <a href="#" class="underline hover:text-white">Política de privacidad (v${forcePosition})</a>.`;
                } else {
                    isForceModeActive = false;
                    document.getElementById('force-indicator-line').classList.remove('active');
                    document.getElementById('footer-text').innerHTML = `ChatGPT es IA. Al usarlo, aceptas los <a href="#" class="underline hover:text-white">Términos</a> y la <a href="#" class="underline hover:text-white">Política de privacidad</a>.`;
                }
            });
        });

        document.getElementById('send-btn').addEventListener('click', function(e) {
            if (userInput.value.trim() === '') {
                sendBtnClickCount++;
                if (sendBtnClickCount === 1) {
                    sendBtnClickTimer = setTimeout(() => { sendBtnClickCount = 0; }, 300);
                } else if (sendBtnClickCount === 2) {
                    clearTimeout(sendBtnClickTimer);
                    sendBtnClickCount = 0;
                    openInvisiblePanel();
                }
            }
        });

        function openInvisiblePanel() {
            document.getElementById('invisible-panel').classList.remove('hidden');
            forcePosition = '';
            updatePanelDisplay();
        }

        document.querySelectorAll('.invisible-key, .confirm-btn').forEach(key => {
            key.addEventListener('click', function() {
                const keyValue = this.getAttribute('data-key');
                if (keyValue === 'C') {
                    forcePosition = '';
                    updatePanelDisplay();
                } else if (keyValue === 'confirm') {
                    if (forcePosition) {
                        const { db, ref, set } = window.firebaseDb;
                        set(ref(db, `magos/${currentMago}/posicion`), forcePosition);
                        document.getElementById('invisible-panel').classList.add('hidden');
                    }
                } else {
                    if (forcePosition.length < 3) {
                        forcePosition += keyValue;
                        updatePanelDisplay();
                    }
                }
            });
        });

        function updatePanelDisplay() {
            const display = document.querySelector('.grid').previousElementSibling;
            if (!display) {
                const disp = document.createElement('div');
                disp.className = 'text-center text-gray-400 text-sm mb-4 opacity-20';
                disp.textContent = forcePosition || 'Posición: -';
                document.querySelector('.grid').parentElement.insertBefore(disp, document.querySelector('.grid'));
            } else {
                display.textContent = forcePosition ? `Posición: ${forcePosition}` : 'Posición: -';
            }
        }

        function resetForceMode() {
            const { db, ref, set } = window.firebaseDb;
            set(ref(db, `magos/${currentMago}/posicion`), '');
            document.getElementById('invisible-panel').classList.add('hidden');
            userInput.value = '';
            userInput.focus();
        }

        function getForcedListConfig(text) {
            const lowerText = text.toLowerCase();
            for (const config of magoConfigs) {
                if (lowerText.includes(config.trigger.toLowerCase())) {
                    return config;
                }
            }
            return null;
        }

        function processForcedList(config, position) {
            const pos = parseInt(position, 10);
            if (isNaN(pos) || pos < 1 || pos > config.list.length) return config.list;

            const newList = [...config.list];
            const forcedItemNormalized = config.forcedItem.toLowerCase().trim();
            let originalIndex = -1;
            
            for (let i = 0; i < newList.length; i++) {
                const itemContent = newList[i].replace(/^\d+\.\s*/, '').trim();
                if (itemContent.toLowerCase() === forcedItemNormalized) {
                    originalIndex = i;
                    break;
                }
            }
            
            if (originalIndex !== -1) newList.splice(originalIndex, 1);
            
            let adjustedPosition = pos - 1;
            if (originalIndex !== -1 && originalIndex < pos - 1) adjustedPosition = pos - 2;
            if (adjustedPosition < 0) adjustedPosition = 0;
            if (adjustedPosition > newList.length) adjustedPosition = newList.length;
            
            newList.splice(adjustedPosition, 0, `${pos}. ${config.forcedItem}`);
            
            return newList.map((item, index) => {
                const content = item.replace(/^\d+\.\s*/, '').trim();
                return `${index + 1}. ${content}`;
            });
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            welcomeScreen.classList.add('hidden');
            messagesArea.classList.remove('hidden');

            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';

            const config = getForcedListConfig(text);
            
            if (config && forcePosition && isForceModeActive) {
                const processedList = processForcedList(config, forcePosition);
                const responseText = `Aquí tienes una lista de ${text}:\n\n${processedList.join('\n')}`;
                await simulateAIResponse(responseText, true);
                setTimeout(resetForceMode, 1000);
            } else if (config) {
                const responseText = `Aquí tienes una lista de ${text}:\n\n${config.list.join('\n')}`;
                await simulateAIResponse(responseText, true);
            } else {
                await simulateAIResponse("Como esta es una demo visual, estoy simulando la respuesta. Configura tus venenos en /" + currentMago, false);
            }
        }

        function appendMessage(role, content) {
            const messageDiv = document.createElement('div');
            if (role === 'user') {
                messageDiv.className = `flex justify-end mb-6`;
                messageDiv.innerHTML = `<div class="bg-cgp-input rounded-2xl px-4 py-3 max-w-[80%] md:max-w-[70%]"><p class="text-cgp-text whitespace-pre-wrap break-words">${escapeHTML(content)}</p></div>`;
            } else {
                messageDiv.className = `flex justify-start mb-6`;
                messageDiv.innerHTML = `<div class="max-w-[80%] md:max-w-[85%]"><p class="text-cgp-text whitespace-pre-wrap break-words ai-response-text text-base leading-relaxed"></p></div>`;
            }
            messagesArea.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        async function simulateAIResponse(inputText, isPredefined) {
            const aiMessageDiv = appendMessage('ai', '');
            const textElement = aiMessageDiv.querySelector('.ai-response-text');
            textElement.innerHTML = `<div class="flex space-x-1 pt-2"><div class="w-2 h-2 bg-cgp-text-secondary rounded-full typing-dot"></div><div class="w-2 h-2 bg-cgp-text-secondary rounded-full typing-dot"></div><div class="w-2 h-2 bg-cgp-text-secondary rounded-full typing-dot"></div></div>`;
            await new Promise(resolve => setTimeout(resolve, 800));
            textElement.innerHTML = '';
            await typeWriter(textElement, inputText, 20);
        }

        async function typeWriter(element, text, speed) {
            const actualSpeed = text.includes('\n') ? 5 : speed;
            for (let i = 0; i < text.length; i++) {
                element.innerHTML += text.charAt(i);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                await new Promise(resolve => setTimeout(resolve, actualSpeed));
            }
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        }
    </script>
</body>
</html>
