<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Root Super Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword,
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwwvgr5C13QZDWb2Bxa1aFf-57YaYrt1c",
            authDomain: "chafgptest.firebaseapp.com",
            databaseURL: "https://chafgptest-default-rtdb.firebaseio.com",
            projectId: "chafgptest",
            storageBucket: "chafgptest.firebasestorage.app",
            messagingSenderId: "853295467331",
            appId: "1:853295467331:web:ebfd40b69e11db09a3bdf6",
            measurementId: "G-DDRR5RZE5W"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        
        window.firebaseApp = { 
            db, auth, ref, onValue, set, update, remove, 
            signInWithEmailAndPassword, createUserWithEmailAndPassword, 
            onAuthStateChanged, signOut 
        };
    </script>
    
    <style>
        body { background-color: #050505; color: #ececec; font-family: system-ui, sans-serif; overflow-x: hidden; }
        .bg-orb { position: fixed; border-radius: 50%; filter: blur(100px); z-index: 0; opacity: 0.3; pointer-events: none; }
        .orb-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #00f3ff; }
        .orb-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: #10a37f; }
        
        .glass-panel { 
            background: rgba(20, 20, 20, 0.6); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); 
        }
        
        .neon-input { 
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: white; 
            transition: all 0.3s ease; 
        }
        .neon-input:focus { 
            outline: none; 
            border-color: #00f3ff; 
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3); 
        }
        
        .neon-btn { 
            background: rgba(16, 163, 127, 0.2); 
            border: 1px solid #10a37f; 
            color: #10a37f; 
            text-shadow: 0 0 5px rgba(16, 163, 127, 0.5); 
            box-shadow: 0 0 10px rgba(16, 163, 127, 0.2); 
            transition: all 0.3s ease; 
        }
        .neon-btn:hover { 
            background: rgba(16, 163, 127, 0.4); 
            box-shadow: 0 0 20px rgba(16, 163, 127, 0.5); 
        }

        .neon-btn-danger {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
            text-shadow: 0 0 5px rgba(239, 68, 68, 0.5);
            transition: all 0.3s ease;
        }
        .neon-btn-danger:hover {
            background: rgba(239, 68, 68, 0.4);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }
        
        .neon-title { text-shadow: 0 0 10px rgba(16, 163, 127, 0.5); }
        
        /* Modal Styles */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <!-- Login Admin -->
    <div id="admin-login" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel p-8 rounded-2xl max-w-md w-full relative z-10">
            <h2 class="text-3xl font-bold mb-6 text-white text-center neon-title">SUPER ADMIN</h2>
            <div class="space-y-4">
                <input type="email" id="admin-email" placeholder="Correo de Administrador" class="neon-input w-full px-4 py-3 rounded-lg">
                <input type="password" id="admin-password" placeholder="Contraseña" class="neon-input w-full px-4 py-3 rounded-lg">
                <button onclick="loginAdmin()" class="neon-btn w-full font-bold py-3 rounded-lg mt-4">Acceder al Panel</button>
                <p id="login-error" class="text-red-400 text-sm text-center hidden"></p>
            </div>
        </div>
    </div>

    <!-- Acceso Denegado -->
    <div id="access-denied" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel p-8 rounded-2xl max-w-md w-full text-center relative z-10">
            <h2 class="text-2xl font-bold text-red-500 mb-4">Acceso Denegado</h2>
            <p class="text-gray-400 mb-6">No tienes permisos de Super Administrador.</p>
            <button onclick="logoutAdmin()" class="neon-btn px-6 py-2 rounded-lg">Salir</button>
        </div>
    </div>

    <!-- Panel Principal (CRUD) -->
    <div id="admin-panel" class="hidden flex-1 flex flex-col relative z-10 w-full">
        <header class="px-6 py-4 border-b border-white/10 backdrop-blur-md bg-black/20 flex justify-between items-center">
            <h1 class="text-xl font-bold text-white neon-title">Panel de Control Root</h1>
            <button onclick="logoutAdmin()" class="text-sm text-red-400 hover:text-red-300">Cerrar Sesión</button>
        </header>

        <div class="flex-1 p-6 max-w-6xl mx-auto w-full">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-semibold text-white">Gestión de Magos (Usuarios)</h2>
                <button onclick="openModal()" class="neon-btn px-4 py-2 rounded-lg font-bold">+ Crear Nuevo Mago</button>
            </div>

            <div class="glass-panel rounded-xl overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-black/40 text-gray-400 text-sm uppercase">
                            <tr>
                                <th class="px-6 py-4">Alias (Mago)</th>
                                <th class="px-6 py-4">Correo Electrónico</th>
                                <th class="px-6 py-4">UID</th>
                                <th class="px-6 py-4 text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body" class="divide-y divide-white/10 text-sm">
                            <tr><td colspan="4" class="px-6 py-8 text-center text-gray-500">Cargando usuarios...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Crear/Editar -->
    <div id="user-modal" class="fixed inset-0 z-[60] flex items-center justify-center p-4 modal-overlay hidden">
        <div class="glass-panel p-6 rounded-2xl max-w-md w-full relative z-10">
            <h3 id="modal-title" class="text-2xl font-bold mb-4 text-white neon-title">Crear Nuevo Mago</h3>
            <div class="space-y-4">
                <input type="text" id="modal-alias" placeholder="Nombre de Mago (Ej: cronos)" class="neon-input w-full px-4 py-3 rounded-lg lowercase">
                <input type="email" id="modal-email" placeholder="Correo electrónico" class="neon-input w-full px-4 py-3 rounded-lg">
                <input type="password" id="modal-password" placeholder="Contraseña (mín. 6 caracteres, solo al crear)" class="neon-input w-full px-4 py-3 rounded-lg">
                
                <div class="flex gap-3 pt-2">
                    <button onclick="closeModal()" class="neon-btn-danger flex-1 font-bold py-3 rounded-lg">Cancelar</button>
                    <button onclick="saveUser()" class="neon-btn flex-1 font-bold py-3 rounded-lg">Guardar</button>
                </div>
                <p id="modal-error" class="text-red-400 text-sm text-center hidden"></p>
            </div>
        </div>
    </div>

    <script>
        // IMPORTANTE: Cambia este correo por el tuyo real para tener acceso al panel
        const SUPER_ADMIN_EMAIL = 'cronosdeveloper52@gmail.com'; 

        let currentUsers = {};
        let editingUid = null;

        window.addEventListener('load', () => {
            const { auth, onAuthStateChanged } = window.firebaseApp;
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    if (user.email === SUPER_ADMIN_EMAIL) {
                        showPanel();
                    } else {
                        showDenied();
                    }
                } else {
                    showLogin();
                }
            });
        });

        async function loginAdmin() {
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value.trim();
            const errorEl = document.getElementById('login-error');
            errorEl.classList.add('hidden');

            const { auth, signInWithEmailAndPassword } = window.firebaseApp;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                errorEl.textContent = 'Credenciales inválidas o error de autenticación.';
                errorEl.classList.remove('hidden');
            }
        }

        function showLogin() {
            document.getElementById('admin-login').classList.remove('hidden');
            document.getElementById('access-denied').classList.add('hidden');
            document.getElementById('admin-panel').classList.add('hidden');
        }

        function showDenied() {
            document.getElementById('admin-login').classList.add('hidden');
            document.getElementById('access-denied').classList.remove('hidden');
            document.getElementById('admin-panel').classList.add('hidden');
        }

        function showPanel() {
            document.getElementById('admin-login').classList.add('hidden');
            document.getElementById('access-denied').classList.add('hidden');
            document.getElementById('admin-panel').classList.remove('hidden');
            loadUsers();
        }

        function loadUsers() {
            const { db, ref, onValue } = window.firebaseApp;
            const dbRef = ref(db, 'users');
            onValue(dbRef, (snapshot) => {
                currentUsers = snapshot.val() || {};
                renderUsers();
            });
        }

        function renderUsers() {
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '';
            const usersArray = Object.entries(currentUsers);

            if (usersArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-8 text-center text-gray-500">No hay usuarios registrados. Crea el primero.</td></tr>';
                return;
            }

            usersArray.forEach(([uid, data]) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-white/5 transition-colors';
                tr.innerHTML = `
                    <td class="px-6 py-4 text-[#10a37f] font-mono font-bold">${data.alias || 'Sin alias'}</td>
                    <td class="px-6 py-4 text-gray-300">${data.email}</td>
                    <td class="px-6 py-4 text-gray-500 font-mono text-xs">${uid.substring(0, 8)}...</td>
                    <td class="px-6 py-4 text-right space-x-2">
                        <button onclick="openModal('${uid}')" class="text-[#00f3ff] hover:text-white text-xs border border-[#00f3ff]/30 px-3 py-1 rounded transition-colors">Editar</button>
                        <button onclick="deleteUser('${uid}')" class="text-red-400 hover:text-white text-xs border border-red-900/50 px-3 py-1 rounded transition-colors">Eliminar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- FUNCIONES DEL MODAL (CREAR / EDITAR) ---

        function openModal(uid = null) {
            editingUid = uid;
            const modal = document.getElementById('user-modal');
            const title = document.getElementById('modal-title');
            const aliasInput = document.getElementById('modal-alias');
            const emailInput = document.getElementById('modal-email');
            const passInput = document.getElementById('modal-password');
            const errorEl = document.getElementById('modal-error');

            errorEl.classList.add('hidden');
            modal.classList.remove('hidden');

            if (uid && currentUsers[uid]) {
                title.textContent = 'Editar Mago';
                aliasInput.value = currentUsers[uid].alias || '';
                emailInput.value = currentUsers[uid].email || '';
                passInput.value = ''; // No mostramos la contraseña por seguridad
                passInput.disabled = true;
                passInput.classList.add('opacity-50');
            } else {
                title.textContent = 'Crear Nuevo Mago';
                aliasInput.value = '';
                emailInput.value = '';
                passInput.value = '';
                passInput.disabled = false;
                passInput.classList.remove('opacity-50');
            }
        }

        function closeModal() {
            document.getElementById('user-modal').classList.add('hidden');
            editingUid = null;
        }

        async function saveUser() {
            const alias = document.getElementById('modal-alias').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
            const email = document.getElementById('modal-email').value.trim();
            const password = document.getElementById('modal-password').value;
            const errorEl = document.getElementById('modal-error');
            
            errorEl.classList.add('hidden');

            if (!alias || alias.length < 3) {
                errorEl.textContent = 'El alias debe tener al menos 3 caracteres.';
                errorEl.classList.remove('hidden');
                return;
            }
            if (!email) {
                errorEl.textContent = 'El correo es obligatorio.';
                errorEl.classList.remove('hidden');
                return;
            }

            const { db, ref, set, update, auth, createUserWithEmailAndPassword } = window.firebaseApp;

            try {
                if (editingUid) {
                    // MODO EDITAR: Actualizamos solo la base de datos
                    await update(ref(db, `users/${editingUid}`), {
                        alias: alias,
                        email: email
                    });
                } else {
                    // MODO CREAR: Creamos el usuario en Auth y luego en la BD
                    if (!password || password.length < 6) {
                        errorEl.textContent = 'La contraseña debe tener al menos 6 caracteres para crear.';
                        errorEl.classList.remove('hidden');
                        return;
                    }
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await set(ref(db, `users/${userCredential.user.uid}`), {
                        email: email,
                        alias: alias,
                        createdAt: Date.now()
                    });
                }
                closeModal();
            } catch (error) {
                console.error(error);
                errorEl.textContent = 'Error: ' + error.message;
                errorEl.classList.remove('hidden');
            }
        }

        async function deleteUser(uid) {
            if (!confirm('¿Estás seguro de eliminar este usuario de la base de datos?')) return;
            
            const { db, ref, remove } = window.firebaseApp;
            try {
                await remove(ref(db, `users/${uid}`));
            } catch (error) {
                alert('Error al eliminar: ' + error.message);
            }
        }

        function logoutAdmin() {
            const { auth, signOut } = window.firebaseApp;
            signOut(auth);
        }
    </script>
</body>
</html>
